[workspace]
members = [
    "rustdaw_engine",
    "rustdaw_sequencer",
    "rustdaw_sampler",
    "rustdaw_effects",
    "rustdaw_app",
    "rustdaw_project",
    "rustdaw_visualizer"
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
rustfft = "6.0"
num-complex = "0.4"
ringbuf = "0.4"
thiserror = "1.0"
rand = "0.8"
